<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Task Manager — Gamesture</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
/* ══════════════════════════════════
   DARK MODE — Tokyo Night palette
   ══════════════════════════════════ */
:root{
  --bg:#1a1b26;
  --col:#24283b;
  --col-gen:#0d0e15;
  --border:#292e42;
  --border2:#3b3f5c;
  --muted:#565f89;
  --faint:#3b3f5c;
  --dark:#c0caf5;
  --dark2:#a9b1d6;
  --blue:#7aa2f7;
  --green:#9ece6a;
  --red:#f7768e;
  --orange:#ff9e64;
  --gold:#e0af68;
  --card:#1f2335;
  --card2:#1a1e30;
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg);
  color:var(--dark);
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:13px;
  display:grid;
  grid-template-rows:auto auto 1fr;
  grid-template-columns:1fr minmax(280px,33%);
  height:100vh;
  overflow:hidden;
}

/* ── Bootstrap overrides ── */
.form-control,.form-select,textarea.form-control{
  background:#16161e!important;color:var(--dark)!important;
  border-color:var(--border2)!important;
}
.form-control:focus,.form-select:focus{
  background:#16161e!important;color:var(--dark)!important;
  border-color:var(--blue)!important;
  box-shadow:0 0 0 .2rem rgba(122,162,247,.2)!important;
}
.form-control::placeholder{color:var(--muted)!important;}
.modal-content{background:var(--card)!important;color:var(--dark)!important;border-color:var(--border2)!important;}
.modal-header,.modal-footer{border-color:var(--border2)!important;}
.modal-title,.form-label{color:var(--dark)!important;}
.btn-close{filter:invert(1) brightness(.7);}
.btn-outline-secondary{color:var(--dark2)!important;border-color:var(--border2)!important;}
.btn-outline-secondary:hover{background:var(--border2)!important;color:var(--dark)!important;border-color:var(--border2)!important;}
.btn-outline-primary{color:var(--blue)!important;border-color:var(--blue)!important;}
.btn-outline-primary:hover{background:rgba(122,162,247,.15)!important;}
.btn-primary{background:#3d59a1!important;border-color:#3d59a1!important;}
.btn-primary:hover{background:#2f4782!important;border-color:#2f4782!important;}
.btn-secondary{background:#292e42!important;border-color:#292e42!important;color:var(--dark)!important;}

/* ── HEADER ── */
.app-hdr{
  grid-column:1/-1;grid-row:1;
  background:#16161e;border-bottom:1px solid var(--border);
  padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  box-shadow:0 1px 6px rgba(0,0,0,.4);z-index:100;
}
.app-title{font-size:16px;font-weight:700;color:var(--dark);white-space:nowrap;}
.week-nav{display:flex;align-items:center;gap:5px;}
.week-lbl{font-size:12px;font-weight:600;color:var(--dark);min-width:190px;text-align:center;}

/* ── LINKS BAR ── */
.links-bar{
  grid-column:1/-1;grid-row:2;
  background:#16161e;border-bottom:1px solid var(--border);
  padding:4px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:32px;
}
.link-btn{
  font-size:11px;color:var(--dark2);background:var(--border);
  border:1px solid var(--border2);border-radius:5px;padding:2px 9px;
  text-decoration:none;transition:background .1s;white-space:nowrap;
}
.link-btn:hover{background:var(--border2);color:var(--dark);}
.links-manage-btn{
  font-size:11px;background:none;border:1px solid var(--border2);border-radius:5px;
  padding:2px 7px;cursor:pointer;color:var(--muted);flex-shrink:0;
}
.links-manage-btn:hover{background:var(--border);color:var(--dark);}

/* ── BOARD ── */
.board{
  grid-column:1;grid-row:3;
  display:flex;gap:12px;padding:14px;
  overflow-x:auto;overflow-y:auto;
  align-items:flex-start;
}
.board::-webkit-scrollbar{height:6px;}
.board::-webkit-scrollbar-track{background:var(--bg);}
.board::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── ONGOING STRIP ── */
.ong-strip{
  grid-column:1;grid-row:3;
  background:#16161e;border-top:2px solid var(--orange);z-index:50;min-height:46px;
}
.ong-hdr{
  display:flex;align-items:center;gap:8px;padding:6px 14px;
  cursor:pointer;user-select:none;
}
.ong-hdr:hover{background:rgba(255,158,100,.06);}
.ong-hdr-title{font-size:12px;font-weight:700;color:var(--orange);}
.ong-cnt{font-size:10px;background:rgba(255,158,100,.2);color:var(--orange);border-radius:8px;padding:0 6px;font-weight:700;}
.ong-toggle{margin-left:auto;font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0 4px;}
.ong-body{
  padding:6px 14px 10px;
  max-height:220px;overflow-y:auto;
}
.ong-body::-webkit-scrollbar{height:4px;}
.ong-body::-webkit-scrollbar-track{background:transparent;}
.ong-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.ong-body.collapsed{display:none;}
.ong-empty{font-size:12px;color:var(--muted);font-style:italic;padding:4px 0;width:100%;}
#ongList{width:100%;display:flex;flex-wrap:wrap;gap:8px;min-height:48px;align-content:flex-start;}
#ongList.drag-over{
  background:rgba(255,158,100,.08);border-radius:8px;
  outline:2px dashed rgba(255,158,100,.35);min-height:60px;
}

/* ── ONGOING CARD ── */
.ong-card{
  background:var(--card);border-radius:8px;
  border:1px solid var(--border);border-left:4px solid var(--orange);
  padding:7px 10px;min-width:190px;max-width:280px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  display:flex;flex-direction:column;gap:5px;
}
.ong-card.priority{background:#1a1e0e;border-left-color:var(--gold);}
.ong-top{display:flex;align-items:center;gap:5px;}
.ong-game-badge{
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;
  color:#fff;display:flex;align-items:center;gap:3px;flex-shrink:0;
}
.ong-game-badge img{width:18px;height:18px;border-radius:3px;object-fit:cover;}
.ong-game-badge .badge-ltr{width:18px;height:18px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;background:rgba(255,255,255,.2);}
.ong-title{font-size:12px;font-weight:500;color:var(--dark);flex:1;line-height:1.4;}
.ong-foot{display:flex;align-items:center;gap:4px;}
.ong-drag{color:var(--faint);cursor:grab;font-size:14px;user-select:none;flex-shrink:0;}
.ong-drag:hover{color:var(--muted);}
.ong-drag:active{cursor:grabbing;}
.ong-return{font-size:11px;background:none;border:1px solid var(--border2);border-radius:3px;padding:1px 5px;cursor:pointer;color:var(--muted);}
.ong-return:hover{background:var(--border);color:var(--dark);}
.ong-cb{
  width:15px;height:15px;border:2px solid var(--border2);border-radius:3px;
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:transparent;transition:all .1s;
}
.ong-cb:hover{border-color:var(--green);}

/* ── SIDEBAR ── */
.sidebar{
  grid-column:2;grid-row:3;
  background:#16161e;border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sb-cal{
  flex:0 0 auto;max-height:42%;
  display:flex;flex-direction:column;overflow:hidden;
  border-bottom:1px solid var(--border);padding:10px 12px 8px;
}
.sb-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;}
.cal-scroll{flex:1;overflow-y:auto;}
.cal-scroll::-webkit-scrollbar{width:4px;}
.cal-scroll::-webkit-scrollbar-track{background:transparent;}
.cal-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.cal-day-hdr{
  font-size:10px;font-weight:700;color:var(--muted);
  padding:4px 0 2px;border-bottom:1px solid var(--border);
  margin-bottom:3px;margin-top:6px;
}
.cal-day-hdr:first-child{margin-top:0;}
.cal-day-hdr.today-hdr{color:var(--blue);}
.cal-entry{
  display:flex;align-items:center;gap:5px;
  padding:4px 5px;border-radius:4px;cursor:pointer;
  transition:background .1s;
}
.cal-entry:hover{background:var(--col);}
.cal-entry.prio-entry{background:rgba(224,175,104,.1);border-left:2px solid var(--gold);padding-left:4px;}
.cal-entry.prio-entry:hover{background:rgba(224,175,104,.18);}
.cal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cal-ttl{font-size:11px;color:var(--dark2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-entry.prio-entry .cal-ttl{font-weight:600;color:var(--gold);}
.cal-star{font-size:10px;flex-shrink:0;}
.cal-day-hdr.this-week-hdr{color:var(--blue);}
.cal-entry.this-week-entry:not(.prio-entry){background:rgba(122,162,247,.07);}
.cal-entry.this-week-entry:not(.prio-entry):hover{background:rgba(122,162,247,.14);}
.cal-entry.this-week-entry:not(.prio-entry) .cal-ttl{color:var(--dark);}
.sb-notes{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px 12px 8px;}
.notes-scroll{flex:1;overflow-y:auto;padding-right:2px;}
.notes-scroll::-webkit-scrollbar{width:4px;}
.notes-scroll::-webkit-scrollbar-track{background:transparent;}
.notes-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ── NOTE CARD ── */
.note-card{
  border-radius:8px;padding:7px 9px;margin-bottom:7px;
  border:1px solid rgba(255,255,255,.06);box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.note-top{display:flex;align-items:center;gap:4px;margin-bottom:4px;}
.note-drag{color:rgba(255,255,255,.2);cursor:grab;font-size:13px;user-select:none;flex-shrink:0;}
.note-drag:hover{color:rgba(255,255,255,.4);}
.note-drag:active{cursor:grabbing;}
.note-colors{display:flex;gap:3px;flex:1;}
.note-cdot{
  width:14px;height:14px;border-radius:3px;cursor:pointer;
  border:1px solid rgba(255,255,255,.25);transition:transform .1s;flex-shrink:0;
}
.note-cdot:hover{transform:scale(1.3);border-color:rgba(255,255,255,.5);}
.note-cdot.active{transform:scale(1.15);border-width:2px;border-color:rgba(255,255,255,.7);}
.note-del{font-size:11px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.3);padding:0 2px;opacity:0;margin-left:auto;}
.note-card:hover .note-del{opacity:1;}
.note-ta{
  width:100%;border:none;outline:none;background:transparent;
  resize:none;font-size:12px;line-height:1.5;padding:0;min-height:30px;
}
.add-note-btn{
  width:100%;background:transparent;border:1px dashed var(--border2);
  border-radius:6px;padding:5px;font-size:11px;cursor:pointer;
  color:var(--muted);margin-top:2px;
}
.add-note-btn:hover{background:var(--border);color:var(--dark);}

/* ── GAME COLUMN ── */
.game-col{min-width:280px;max-width:300px;background:var(--col);border-radius:12px;padding:10px;flex-shrink:0;}
.game-col.general-col{background:var(--col-gen);border:1px dashed var(--muted);}
.col-hdr{
  display:flex;align-items:center;gap:8px;
  padding:2px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:8px;
}
.col-icon{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid var(--border);}
.col-icon-ph{
  width:40px;height:40px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;color:#fff;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);
}
.col-name{font-weight:600;font-size:13px;color:var(--dark);flex:1;cursor:pointer;border-radius:3px;padding:1px 3px;}
.col-name:hover{background:var(--border);}
.col-del{opacity:0;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px;}
.game-col:hover .col-del{opacity:.4;}
.col-del:hover{opacity:1!important;color:var(--red);}
.icon-file-inp{display:none;}

/* ── SECTION ── */
.sec-lbl{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  padding:4px 2px 2px;display:flex;align-items:center;justify-content:space-between;
}
.sec-cnt{font-size:10px;background:rgba(255,255,255,.08);border-radius:8px;padding:0 5px;font-weight:700;}
.task-list{min-height:28px;}
.empty-msg{font-size:11px;color:var(--faint);text-align:center;padding:8px 0;font-style:italic;pointer-events:none;}

/* ── TASK CARD ── */
.task-card{
  background:var(--card);border-radius:8px;
  padding:7px 9px 6px 12px;margin-bottom:6px;
  border-left:4px solid var(--border2);
  box-shadow:0 1px 4px rgba(0,0,0,.35);
  transition:box-shadow .12s;position:relative;
}
.task-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.5);}
.task-card[data-status="done"]{opacity:.45;border-left-color:var(--green);}
.task-card.priority{border-left-color:var(--gold);background:linear-gradient(to right,rgba(224,175,104,.08),var(--card));}
.task-card.sortable-ghost{opacity:.25;background:#2d3050;}
.task-card.sortable-chosen{box-shadow:0 8px 24px rgba(0,0,0,.6);transform:rotate(1.5deg);}
.task-card.hl{animation:pulse .35s ease 2;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--blue);}50%{box-shadow:0 0 0 0 var(--blue);}}

/* Card layout */
.card-top{display:flex;align-items:flex-start;gap:4px;}
.drag-handle{color:var(--faint);cursor:grab;font-size:14px;line-height:1;margin-top:2px;flex-shrink:0;user-select:none;}
.drag-handle:hover{color:var(--muted);}
.drag-handle:active{cursor:grabbing;}

/* Checkbox */
.cb{
  width:15px;height:15px;border:2px solid var(--border2);border-radius:3px;
  flex-shrink:0;cursor:pointer;margin-top:2px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;transition:all .1s;
}
.cb:hover{border-color:var(--green);}
.cb.done{background:var(--green);border-color:var(--green);}
.cb.done::after{content:'✓';color:#1a1b26;font-size:10px;font-weight:700;line-height:1;}

/* Date area */
.card-date{flex-shrink:0;display:flex;align-items:center;margin-top:1px;}
.date-chip{
  font-size:10.5px;font-weight:600;border-radius:3px;padding:2px 5px;
  background:var(--border);color:var(--dark2);cursor:pointer;white-space:nowrap;
  border:1px solid transparent;
}
.date-chip:hover{background:var(--border2);color:var(--dark);}
.date-chip.today{background:rgba(122,162,247,.2);color:var(--blue);font-weight:700;}
.date-chip.late{background:rgba(247,118,142,.15);color:var(--red);}
.date-input{
  font-size:11px;border:1px solid var(--border2);border-radius:4px;
  padding:1px 4px;color:var(--dark);background:var(--bg);cursor:pointer;width:110px;
}
.date-input:focus{border-color:var(--blue);outline:none;}
.btn-add-date{
  font-size:14px;background:none;border:none;cursor:pointer;
  opacity:.55;padding:0;line-height:1;
}
.btn-add-date:hover{opacity:.9;}

/* Title */
.title-wrap{flex:1;min-width:0;}
.title-display{
  font-size:12px;font-weight:500;line-height:1.45;color:var(--dark);
  cursor:pointer;word-break:break-word;min-height:18px;
}
.title-display:hover{opacity:.82;}
.title-link{color:var(--blue)!important;cursor:pointer;}
.title-link:hover{text-decoration:underline;opacity:1!important;}
[data-status="done"] .title-display{text-decoration:line-through;color:var(--muted);}
.time-hl{color:var(--orange);font-weight:700;}
.card-title{
  width:100%;
  font-size:12px;font-weight:500;line-height:1.45;color:var(--dark);
  border:none;outline:none;background:transparent;
  resize:none;padding:0;overflow:hidden;min-height:18px;display:none;
}
.card-title:focus{background:rgba(255,255,255,.04);border-radius:3px;padding:1px 4px;}
.task-card.expanded .title-display{display:none;}
.task-card.expanded .card-title{display:block!important;}
[data-status="done"] .card-title{text-decoration:line-through;color:var(--muted);}

/* Actions (top-right) */
.card-actions{
  flex-shrink:0;display:flex;gap:1px;align-items:center;
  opacity:0;transition:opacity .12s;margin-top:1px;
}
.task-card:hover .card-actions{opacity:1;}
.task-card.priority .card-actions{opacity:1;}
.btn-prio{background:none;border:none;cursor:pointer;font-size:13px;padding:0 1px;opacity:.6;line-height:1;}
.btn-prio:hover,.btn-prio.on{opacity:1;}
.btn-ong{font-size:13px;background:none;border:none;cursor:pointer;padding:0 1px;opacity:.3;line-height:1;}
.btn-ong:hover{opacity:1;}
.del-btn{font-size:12px;background:none;border:none;cursor:pointer;color:var(--muted);padding:0 2px;line-height:1;}
.del-btn:hover{color:var(--red);}

/* Expandable section */
.card-expand{display:none;padding-left:37px;margin-top:4px;}
.task-card.expanded .card-expand{display:block;}
/* Note */
.card-note{
  font-size:11px;color:var(--muted);
  width:100%;border:none;outline:none;background:transparent;
  resize:none;padding:0;overflow:hidden;
}
.card-note:focus{background:rgba(255,255,255,.04);border-radius:3px;padding:1px 4px;}
.card-note::placeholder{color:var(--faint);font-style:italic;}
/* Attachments */
.attach-area{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;}
.attach-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;}
.attach-thumb{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--border2);cursor:pointer;}
.attach-link{font-size:10px;color:var(--blue);background:var(--border);padding:2px 5px;border-radius:3px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;display:block;}
.attach-del{position:absolute;top:-4px;right:-4px;width:14px;height:14px;background:var(--red);border-radius:50%;font-size:8px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .1s;border:none;}
.attach-item:hover .attach-del{opacity:1;}
.btn-add-attach{font-size:11px;background:none;border:1px dashed var(--border2);border-radius:4px;padding:2px 7px;cursor:pointer;color:var(--muted);flex-shrink:0;}
.btn-add-attach:hover{border-color:var(--muted);color:var(--dark);}
.attach-file-inp{display:none;}
/* Drag-over drop zone */
.task-card.drag-over .card-expand{outline:2px dashed var(--blue);background:rgba(122,162,247,.07);border-radius:6px;min-height:40px;display:block;}
/* Subtasks */
.subtasks-area{margin-bottom:4px;}
.subtask{display:flex;align-items:center;gap:5px;padding:2px 0;}
.subtask-cb{width:13px;height:13px;border:2px solid var(--border2);border-radius:2px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;transition:all .1s;}
.subtask-cb:hover{border-color:var(--green);}
.subtask-cb.done{background:var(--green);border-color:var(--green);}
.subtask-cb.done::after{content:'✓';color:#1a1b26;font-size:8px;font-weight:700;line-height:1;}
.subtask-title{font-size:11px;color:var(--dark2);flex:1;cursor:default;}
.subtask-title.done-text{text-decoration:line-through;color:var(--muted);}
.subtask-del{background:none;border:none;cursor:pointer;color:var(--faint);font-size:10px;padding:0 2px;opacity:0;line-height:1;}
.subtask:hover .subtask-del{opacity:1;}
.subtask-del:hover{color:var(--red);}
.subtask-inp{width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border2);outline:none;font-size:11px;color:var(--dark2);padding:2px 0;margin-top:2px;}
.subtask-inp::placeholder{color:var(--faint);font-style:italic;}
.subtask-inp:focus{border-bottom-color:var(--blue);}
/* Context menu */
.ctx-menu{position:fixed;background:var(--card);border:1px solid var(--border2);border-radius:7px;padding:4px 0;min-width:210px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.6);display:none;}
.ctx-item{padding:7px 14px;font-size:12px;color:var(--dark2);cursor:pointer;display:flex;align-items:center;gap:8px;}
.ctx-item:hover{background:var(--border);color:var(--dark);}

/* ── ADD TASK BTN ── */
.add-task-btn{
  width:100%;background:transparent;border:none;text-align:left;
  font-size:12px;color:var(--muted);padding:5px 6px;border-radius:6px;cursor:pointer;margin-top:2px;
}
.add-task-btn:hover{background:var(--border);color:var(--dark);}

/* ── DONE SECTION ── */
details.done-sec>summary{
  list-style:none;cursor:pointer;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  padding:5px 2px 2px;display:flex;align-items:center;gap:4px;user-select:none;
}
details.done-sec>summary::-webkit-details-marker{display:none;}
.done-arrow{display:inline-block;transition:transform .2s;}
details.done-sec[open] .done-arrow{transform:rotate(90deg);}

/* ── ADD GAME COL ── */
.add-game-col{
  min-width:150px;border-radius:12px;border:2px dashed var(--border2);
  background:rgba(36,40,59,.5);display:flex;align-items:center;
  justify-content:center;padding:20px 10px;cursor:pointer;
  flex-shrink:0;transition:border-color .15s,background .15s;align-self:flex-start;
}
.add-game-col:hover{background:var(--border);border-color:var(--muted);}
.add-game-col span{font-size:12px;color:var(--muted);text-align:center;line-height:2;}

/* ── EMPTY STATE ── */
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);}

/* ── BOARD COLUMNS (new) ── */
.board-col{min-width:336px;max-width:384px;background:var(--col);border-radius:12px;padding:10px;flex-shrink:0;}
.board-col.inbox-col{background:var(--col-gen);border:1px dashed var(--muted);}
.board-col.today-col{border:1px solid rgba(122,162,247,.2);}
.col-hdr-new{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.col-title{font-weight:700;font-size:13px;color:var(--dark);flex:1;}
.col-title-icon{font-size:16px;flex-shrink:0;}

/* ── GAME BADGE ON CARD ── */
.card-game-badge{
  font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;
  color:#fff;display:inline-flex;align-items:center;gap:2px;
  opacity:.85;margin-top:2px;
}
.card-badges{padding-left:37px;margin-bottom:1px;}

/* ── GAME PICKER IN MODAL ── */
.game-picker-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:3px 0;}
.game-pick-btn{
  display:flex;align-items:center;gap:5px;
  background:var(--border);border:2px solid transparent;
  border-radius:7px;padding:4px 8px;cursor:pointer;
  font-size:11px;color:var(--dark2);transition:all .12s;white-space:nowrap;
  outline:none;
}
.game-pick-btn:hover{border-color:var(--border2);color:var(--dark);background:var(--border2);}
.game-pick-btn.selected{border-color:var(--blue);background:rgba(122,162,247,.15);color:var(--dark);}

/* ── W TOKU COLUMN ── */
.wtoku-col{border:1px solid rgba(255,158,100,.3);background:rgba(255,158,100,.04);}
.wtoku-col .col-title{color:var(--orange);}

/* ── BADGE PICKER FLOAT ── */
.badge-picker-float{
  position:fixed;z-index:9999;background:var(--card);border:1px solid var(--border2);
  border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:5px;
  box-shadow:0 6px 20px rgba(0,0,0,.6);min-width:160px;max-width:260px;
}
.badge-pick-item{
  background:none;border:2px solid transparent;border-radius:5px;padding:2px 4px;
  cursor:pointer;display:flex;align-items:center;gap:3px;transition:border-color .1s;
}
.badge-pick-item:hover{border-color:var(--blue);}
.card-game-badge{cursor:pointer;}

/* ── GAME EDITOR ── */
.ge-row{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  border-bottom:1px solid var(--border);
}
.ge-row:last-child{border-bottom:none;}
.ge-icon-btn{cursor:pointer;flex-shrink:0;border-radius:6px;padding:1px;transition:background .1s;}
.ge-icon-btn:hover{background:var(--border2);}
.ge-name{flex:1;font-size:12px;}
.ge-color{width:32px;height:28px;padding:2px;border-radius:5px;cursor:pointer;flex-shrink:0;}
.ge-del-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0 3px;line-height:1;}
.ge-del-btn:hover:not(:disabled){color:var(--red);}
.ge-del-btn:disabled{opacity:.25;cursor:default;}

/* ── ICON EDITOR FLOAT ── */
.icon-editor-float{
  position:fixed;z-index:10000;background:var(--card);border:1px solid var(--border2);
  border-radius:8px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.6);min-width:180px;
}

/* ── SCROLLBARS (global) ── */
*::-webkit-scrollbar{width:5px;height:5px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── VACATION ENTRY ── */
.cal-vacation-entry{
  display:flex;align-items:center;gap:5px;
  padding:4px 5px;border-radius:4px;
  background:rgba(158,206,106,.12);border-left:2px solid var(--green);
  margin-bottom:2px;
}
.cal-vacation-lbl{font-size:11px;color:var(--green);font-weight:600;flex:1;}

/* ── EDIT TASK MODAL ── */
.et-subtask-row{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
.et-subtask-inp{flex:1;font-size:12px;}
.et-sub-done{width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.et-sub-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;padding:0 2px;line-height:1;}
.et-sub-del:hover{color:var(--red);}

/* ── AT SUBTASKS ── */
.at-sub-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.at-sub-title{flex:1;font-size:11px;color:var(--dark2);}
.at-sub-del{background:none;border:none;cursor:pointer;color:var(--faint);font-size:11px;padding:0 3px;line-height:1;}
.at-sub-del:hover{color:var(--red);}

/* ── RECURRING MODAL ── */
.rc-row{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--border);font-size:12px;}
.rc-row:last-child{border-bottom:none;}
.rc-title{flex:1;color:var(--dark);}
.rc-interval{font-size:11px;color:var(--muted);}
.rc-toggle{cursor:pointer;font-size:13px;}
.rc-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;padding:0 3px;line-height:1;}
.rc-del:hover{color:var(--red);}
</style>
</head>

<script>
'use strict';

// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const STORAGE_KEY='gamesture-tasks-v2';
const DEFAULT_GAMES=[
  {name:'Ogólne',          icon:'🌐', color:'#565f89', general:true},
  {name:'The Gang',        icon:null, color:'#f7768e'},
  {name:'Cooking Wars',    icon:null, color:'#ff9e64'},

// Dark-mode note colors — user palette
const NOTE_COLORS=[
  '#1e0806',  // dark burgundy
  '#060f22',  // deep navy (new)
  '#0d1830',  // dark navy blue
  '#1a0f1c',  // dark plum/mauve

// ── FILE HANDLE (File System Access API) ──
let fileHandle=null;

async function idbOpen(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('tm-fh',1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore('h');
    req.onsuccess=e=>res(e.target.result);
    req.onerror=rej;
  });
}
async function idbSaveHandle(h){
  try{const db=await idbOpen();const tx=db.transaction('h','readwrite');tx.objectStore('h').put(h,'main');}catch(_){}
}
async function idbLoadHandle(){
  try{
    const db=await idbOpen();
    return new Promise((res,rej)=>{const tx=db.transaction('h','readonly');const r=tx.objectStore('h').get('main');r.onsuccess=()=>res(r.result);r.onerror=rej;});
  }catch{return null;}
}
async function idbClearHandle(){
  try{const db=await idbOpen();const tx=db.transaction('h','readwrite');tx.objectStore('h').delete('main');}catch(_){}
}

async function saveToFile(){
  if(!fileHandle)return;
  try{
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(state,null,2));
    await w.close();
  }catch(e){console.warn('File save failed:',e);}
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  if(fileHandle) saveToFile();
}

async function loadFromFile(h){
  const file=await h.getFile();
  const text=await file.text();
  return migrateData(JSON.parse(text));
}

// ── MIGRATION ──
function migrateData(s){
  if(!s||typeof s!=='object') s={};
  if (!Array.isArray(s.games)) s.games=[];
  if (s.games.length&&typeof s.games[0]==='string'){
    const P=['#f7768e','#bb9af7','#ff9e64','#565f89'];
    s.games=s.games.map((name,i)=>({name,icon:null,color:P[i%P.length]}));
  }
  if (!Array.isArray(s.tasks)){
    const flat=[];
    if (s.tasks&&typeof s.tasks==='object'){
      Object.entries(s.tasks).forEach(([wk,arr])=>{
        if (!Array.isArray(arr)) return;
        arr.forEach(t=>{
          let st=t.status||'active';
          if(st==='todo'||st==='in-progress') st='active';
          flat.push({...t,weekKey:wk,status:st});
        });
      });
    }
    s.tasks=flat;
  }
  if (!Array.isArray(s.tasks)) s.tasks=[];
  s.tasks.forEach(t=>{
    if(!t.status||t.status==='todo'||t.status==='in-progress') t.status='active';
    if(!t.weekKey) t.weekKey=isoWeekKey(new Date());
    if(t.priority===undefined) t.priority=false;
    if(!t.note) t.note='';
    if(t.order===undefined) t.order=0;
    if(!t.attachments) t.attachments=[];
    if(!t.subtasks) t.subtasks=[];
    if(t.link===undefined) t.link=null;
  });
  const GAME_ORDER=['Ogólne','The Gang','Cooking Wars','Mafia Rivals'];
  s.games.sort((a,b)=>{
    const ai=GAME_ORDER.indexOf(a.name),bi=GAME_ORDER.indexOf(b.name);
    if(ai<0&&bi<0)return 0;if(ai<0)return 1;if(bi<0)return-1;return ai-bi;
  });
  if(!s.dailyPipeline) s.dailyPipeline={
    enabled:true,
    title:'Daily Pipeline',
    subtasks:[
      'Morning Support Check | https://gamesture.helpshift.com/admin/issues/0-91/',
      'TG Refunds',
      'FB posts',
      'FB dms',
      '12:00 Support Check | https://gamesture.helpshift.com/admin/issues/0-91/',
      'Store Reviews | http://tools-01.gannet-kitefin.ts.net:5566/inbox'
    ]
  };
  if(!s.links) s.links=[
    {id:'l1',label:'Helpshift',url:'https://gamesture.helpshift.com/admin/issues/0-91/'},
    {id:'l2',label:'Store Reviews',url:'http://tools-01.gannet-kitefin.ts.net:5566/inbox'}
  ];
  if(!s.vacations) s.vacations=[];
  if(!s.recurring) s.recurring=[];
  if(!s.notes) s.notes=[];
  if(!Array.isArray(s.notes)){
    const merged=[];
    Object.values(s.notes).forEach(val=>{
      if(typeof val==='string'){if(val.trim())merged.push({id:uid(),text:val,color:'#1e0806'});}
      else if(Array.isArray(val)) val.forEach(n=>{if(n&&n.id)merged.push(n);});
    });
    s.notes=merged;
  }
  s.notes.forEach(n=>{if(!n.color)n.color='#1e0806';});
  return s;
}
function loadAndMigrate(){
  let s;try{s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(_){}
  return migrateData(s||{});
}

// ═══════════════════════════════════════
// WEEK UTILITIES
// ═══════════════════════════════════════
function isoWeekKey(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dow=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dow);
  const y1=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const wn=Math.ceil((((d-y1)/864e5)+1)/7);
  return `${d.getUTCFullYear()}-W${String(wn).padStart(2,'0')}`;
}
function dateStrToWk(ds){const[y,m,d]=ds.split('-').map(Number);return isoWeekKey(new Date(y,m-1,d));}
function weekRange(wk){
  const[yr,wn]=wk.split('-W').map(Number);
  const jan4=new Date(Date.UTC(yr,0,4));
  const mon=new Date(jan4);
  mon.setUTCDate(jan4.getUTCDate()-((jan4.getUTCDay()||7)-1)+(wn-1)*7);
  const sun=new Date(mon);sun.setUTCDate(mon.getUTCDate()+6);
  return{mon,sun};
}
function shiftWeek(wk,n){
  const{mon}=weekRange(wk);
  const d=new Date(mon.getUTCFullYear(),mon.getUTCMonth(),mon.getUTCDate());
  d.setDate(d.getDate()+n*7);return isoWeekKey(d);
}
function isInWeek(ds,wk){
  if(!ds) return false;
  const{mon,sun}=weekRange(wk);
  const[y,m,d]=ds.split('-').map(Number);
  const t=new Date(Date.UTC(y,m-1,d));
  return t>=mon&&t<=sun;
}
function todayStr(){const n=new Date();return`${n.getFullYear()}-${p2(n.getMonth()+1)}-${p2(n.getDate())}`;}
function p2(n){return String(n).padStart(2,'0');}
const PL_MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const PL_DNI=['Nd','Pon','Wt','Śr','Czw','Pt','Sb'];
function fmtDate(ds){
  if(!ds) return'';
  const[y,m,d]=ds.split('-').map(Number);
  return`${p2(d)}/${p2(m)}/${y}`;
}
function fmtWeek(wk){
  const{mon,sun}=weekRange(wk);
  const sd=mon.getUTCDate(),sm=PL_MON[mon.getUTCMonth()];
  const ed=sun.getUTCDate(),em=PL_MON[sun.getUTCMonth()],yr=sun.getUTCFullYear();
  return mon.getUTCMonth()===sun.getUTCMonth()?`${sd}–${ed} ${em} ${yr}`:`${sd} ${sm} – ${ed} ${em} ${yr}`;
}

function buildBoardCol(status,title,cls){
  const col=document.createElement('div');
  col.className=`board-col ${cls}`;
  col.dataset.colStatus=status;
  const allActive=state.tasks.filter(t=>t.status===status&&t.weekKey===currentWeekKey);
  const dated=allActive.filter(t=>t.date).sort((a,b)=>a.date.localeCompare(b.date));
  const undated=allActive.filter(t=>!t.date).sort((a,b)=>(a.order||0)-(b.order||0));
  const active=[...dated,...undated];
  let doneSection='';
  if(status==='active'){
    const done=state.tasks.filter(t=>t.status==='done'&&t.weekKey===currentWeekKey).sort((a,b)=>(a.order||0)-(b.order||0));
    doneSection=`<details class="done-sec mt-1">
      <summary><span class="done-arrow">▶</span> Gotowe <span class="sec-cnt ms-1">${done.length}</span></summary>
      <div class="task-list done-list mt-1" data-col-status="done">
        ${done.map(cardHtml).join('')||'<div class="empty-msg">Brak</div>'}
      </div>
    </details>`;
  }
  col.innerHTML=`
    <div class="col-hdr-new">
      <span class="col-title">${title}</span>
      ${active.length?`<span class="sec-cnt">${active.length}</span>`:''}
    </div>
    <div class="task-list tw-list" data-col-status="${status}">
      ${active.map(cardHtml).join('')||'<div class="empty-msg">Brak zadań</div>'}
    </div>
    <button class="add-task-btn" data-add-status="${status}">+ Dodaj zadanie</button>
    ${doneSection}`;
  return col;
}

function cardHtml(t){
  const td=todayStr(),ds=t.date||'';
  let chipCls='';
  if(ds===td) chipCls='today';
  else if(ds&&ds<td) chipCls='late';
  const dateArea=ds
    ?`<div class="card-date">
        <span class="date-chip ${chipCls}" data-action="edit-date" data-id="${t.id}">${fmtDate(ds)}</span>
        <input type="date" class="date-input" lang="en-GB" data-f="date" data-id="${t.id}" value="${ds}" style="display:none">
      </div>`
    :`<div class="card-date">
        <button class="btn-add-date" data-action="show-date" data-id="${t.id}" title="Dodaj datę">📅</button>
        <input type="date" class="date-input" lang="en-GB" data-f="date" data-id="${t.id}" value="" style="display:none">
      </div>`;
  const atts=(t.attachments||[]);
  const attHtml=atts.map(a=>{
    const preview=a.type.startsWith('image/')
      ?`<img src="${a.data}" class="attach-thumb" title="${esc(a.name)}" data-action="view-attach" data-att-id="${a.id}" data-id="${t.id}">`
      :`<a class="attach-link" href="${a.data}" download="${esc(a.name)}" title="${esc(a.name)}">${esc(a.name)}</a>`;
    return`<div class="attach-item">${preview}<button class="attach-del" data-action="del-attach" data-att-id="${a.id}" data-id="${t.id}">✕</button></div>`;
  }).join('');
  const subs=(t.subtasks||[]);
  const subsHtml=subs.map(s=>`
<div class="subtask" data-subtask-id="${s.id}" data-id="${t.id}">
  <div class="subtask-cb ${s.done?'done':''}" data-action="toggle-subtask" data-subtask-id="${s.id}" data-id="${t.id}"></div>

    ?`<a class="subtask-title ${s.done?'done-text':''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">${formatWithTimes(s.title)}<span style="opacity:.5;font-size:9px;margin-left:2px">↗</span></a>`
    :`<span class="subtask-title ${s.done?'done-text':''}">${formatWithTimes(s.title)}</span>`

  <button class="subtask-del" data-action="del-subtask" data-subtask-id="${s.id}" data-id="${t.id}">✕</button>
</div>`).join('');
  const isExp=expandedCards.has(t.id);
  const titleDisp=t.link
    ?`<div class="title-display title-link" data-action="open-link" data-link="${esc(t.link)}" data-id="${t.id}" title="Otwórz link">${formatWithTimes(t.title)} <span style="font-size:10px;opacity:.5">↗</span></div>`
    :`<div class="title-display" data-action="expand" data-id="${t.id}">${formatWithTimes(t.title)}</div>`;
  return`
<div class="task-card ${t.priority?'priority':''} ${isExp?'expanded':''}" data-id="${t.id}" data-status="${t.status}">
  <div class="card-top">
    <span class="drag-handle">⠿</span>
    <div class="cb ${t.status==='done'?'done':''}" data-action="toggle" data-id="${t.id}"></div>
    ${dateArea}
    <div class="title-wrap">
      ${titleDisp}
      <textarea class="card-title" data-f="title" data-id="${t.id}" rows="1" spellcheck="false">${esc(t.title)}</textarea>
    </div>

      <button class="btn-prio ${t.priority?'on':''}" data-action="priority" data-id="${t.id}" title="${t.priority?'Usuń priorytet':'Oznacz jako ważne'}">${t.priority?'⭐':'☆'}</button>

    </div>
  </div>
  ${t.game?`<div class="card-badges">${cardGameBadgeHtml(t.game)}</div>`:''}
  <div class="card-expand">

    <textarea class="card-note" data-f="note" data-id="${t.id}" rows="1" placeholder="Notatka..." spellcheck="false">${esc(t.note||'')}</textarea>
    <div class="attach-area" style="${atts.length?'':'display:none'}">${attHtml}</div>

}

function renderCalendar(){
  const calView=document.getElementById('calView');
  const tasks=state.tasks.filter(t=>t.date&&t.status!=='done').sort((a,b)=>a.date.localeCompare(b.date));
  // Build vacation date map: expand each vacation into individual dates
  const vacByDate={};
  (state.vacations||[]).forEach(v=>{
    if(!v.start||!v.end)return;
    const[sy,sm,sd]=v.start.split('-').map(Number);
    const[ey,em,ed]=v.end.split('-').map(Number);
    const cur=new Date(Date.UTC(sy,sm-1,sd));
    const end=new Date(Date.UTC(ey,em-1,ed));
    while(cur<=end){
      const ds=`${cur.getUTCFullYear()}-${p2(cur.getUTCMonth()+1)}-${p2(cur.getUTCDate())}`;
      if(!vacByDate[ds])vacByDate[ds]=[];
      vacByDate[ds].push(v);
      cur.setUTCDate(cur.getUTCDate()+1);
    }
  });
  // Merge all dates
  const allDates=new Set([...Object.keys(vacByDate),...tasks.map(t=>t.date)]);
  if(!allDates.size){
    calView.innerHTML='<div style="font-size:11px;color:var(--faint);font-style:italic;padding:4px 0">Brak zadań z datą</div>';return;
  }
  const td=todayStr(),thisWk=isoWeekKey(new Date()),byDate={};
  tasks.forEach(t=>{if(!byDate[t.date])byDate[t.date]=[];byDate[t.date].push(t);});
  let html='';
  [...allDates].sort().forEach(ds=>{
    const isToday=ds===td;
    const isThisWk=dateStrToWk(ds)===thisWk;
    const hasTaskOrVac=(byDate[ds]&&byDate[ds].length)||(vacByDate[ds]&&vacByDate[ds].length);
    if(!hasTaskOrVac)return;
    html+=`<div class="cal-day-hdr ${isToday?'today-hdr':isThisWk?'this-week-hdr':''}">${fmtDate(ds)}${isToday?' ★':''}</div>`;
    // Show vacation entries first
    (vacByDate[ds]||[]).forEach(v=>{
      const label=v.note?`🏖️ Urlop - ${esc(v.note)}`:'🏖️ Urlop';
      html+=`<div class="cal-vacation-entry"><span class="cal-vacation-lbl">${label}</span></div>`;
    });
    (byDate[ds]||[]).forEach(t=>{
      const col=gameColor(t.game);
      const g=gameCfg(t.game);
      const dotHtml=g?.icon&&g.icon.startsWith('data:')
        ?`<img src="${g.icon}" style="width:12px;height:12px;border-radius:2px;object-fit:cover;flex-shrink:0" alt="">`
        :`<span class="cal-dot" style="background:${col}"></span>`;
      html+=`<div class="cal-entry ${t.priority?'prio-entry':''} ${isThisWk?'this-week-entry':''}" data-nav-id="${t.id}">
        ${dotHtml}
        <span class="cal-ttl">${esc(t.title)}</span>
        ${t.priority?'<span class="cal-star">⭐</span>':''}
      </div>`;
    });
  });
  calView.innerHTML=html||'<div style="font-size:11px;color:var(--faint);font-style:italic;padding:4px 0">Brak zadań z datą</div>';
}

function startRename(el){
  const oldName=el.dataset.game;
  const inp=document.createElement('input');
  inp.type='text';inp.value=oldName;
  inp.className='form-control form-control-sm d-inline-block';
  inp.style.cssText='width:140px;font-size:12px;height:24px;padding:2px 6px;';
  el.replaceWith(inp);inp.focus();inp.select();
  function commit(){
    const name=inp.value.trim();
    if(name&&name!==oldName){
      const i=state.games.findIndex(g=>g.name===oldName);
      if(i>=0) state.games[i].name=name;
      state.tasks.forEach(t=>{if(t.game===oldName) t.game=name;});save();
    }
    renderApp();
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();}if(e.key==='Escape')renderApp();});
}

// ═══════════════════════════════════════
// ATTACHMENTS
// ═══════════════════════════════════════
function handleAttachUploadFiles(taskId,files){
  if(!taskId||!files.length)return;
  const t=taskById(taskId);if(!t)return;
  if(!t.attachments)t.attachments=[];
  let remaining=files.length;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      if(file.type.startsWith('image/')){
        const img=new Image();
        img.onload=()=>{
          const MAX=700,c=document.createElement('canvas');
          let w=img.width,h=img.height;
          if(w>MAX||h>MAX){const r=MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
          c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
          t.attachments.push({id:uid(),name:file.name,type:file.type,data:c.toDataURL('image/jpeg',.85)});
          if(!--remaining){save();expandedCards.add(taskId);renderApp();}
        };img.src=ev.target.result;
      }else{
        t.attachments.push({id:uid(),name:file.name,type:file.type,data:ev.target.result});
        if(!--remaining){save();expandedCards.add(taskId);renderApp();}
      }
    };reader.readAsDataURL(file);
  });
}

function toggleSubtask(taskId,subId){

  s.done=!s.done;
  if(t.subtasks.length&&t.subtasks.every(x=>x.done)) patchTask(taskId,{subtasks:t.subtasks,status:'done'});
  else patchTask(taskId,{subtasks:t.subtasks,status:t.status==='done'&&!t.subtasks.every(x=>x.done)?'active':t.status});
  renderApp();
}
function deleteSubtask(taskId,subId){
  const t=taskById(taskId);if(!t)return;
  t.subtasks=t.subtasks.filter(x=>x.id!==subId);
  patchTask(taskId,{subtasks:t.subtasks});renderApp();

function addRecurring(){
  const title=document.getElementById('rcTitle').value.trim();if(!title){alert('Wpisz tytuł.');return;}
  const game=document.getElementById('rcGame').value||state.games[0]?.name||'';
  const interval=parseInt(document.getElementById('rcInterval').value)||7;
  const note=document.getElementById('rcNote').value.trim();
  const rawSubs=document.getElementById('rcSubtasks').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!state.recurring)state.recurring=[];
  state.recurring.push({id:uid(),title,game,note,subtasks:rawSubs,interval,lastSeeded:null,enabled:true});
  save();renderRecurringList();
  document.getElementById('rcTitle').value='';
  document.getElementById('rcInterval').value='7';
  document.getElementById('rcNote').value='';
  document.getElementById('rcSubtasks').value='';
}
function deleteRecurring(id){
  state.recurring=(state.recurring||[]).filter(r=>r.id!==id);
  save();renderRecurringList();
}
function toggleRecurring(id){
  const r=(state.recurring||[]).find(x=>x.id===id);
  if(r){r.enabled=!r.enabled;save();renderRecurringList();}
}
function seedRecurring(){
  const today=todayStr();
  const todayWk=isoWeekKey(new Date());
  let changed=false;
  (state.recurring||[]).forEach(r=>{
    if(!r.enabled)return;
    const interval=r.interval||7;
    let shouldSeed=false;
    if(!r.lastSeeded) shouldSeed=true;
    else{
      const[ly,lm,ld]=r.lastSeeded.split('-').map(Number);
      const last=new Date(Date.UTC(ly,lm-1,ld));
      const now=new Date();
      const diffDays=Math.floor((now-last)/864e5);
      if(diffDays>=interval) shouldSeed=true;
    }
    if(shouldSeed){
      const alreadyExists=state.tasks.some(t=>t._recurringId===r.id&&t.date===today);
      if(!alreadyExists){
        const subs=(r.subtasks||[]).map(line=>{
          const parts=String(line).split('|').map(x=>x.trim());
          return{id:uid(),title:parts[0],done:false,link:parts[1]||null};
        });
        state.tasks.push({
          id:uid(),game:r.game||state.games[0]?.name||'',title:r.title,
          date:today,note:r.note||'',status:'inbox',priority:false,
          weekKey:todayWk,order:state.tasks.length,attachments:[],subtasks:subs,link:null,
          _recurringId:r.id
        });
        changed=true;
      }
      r.lastSeeded=today;
    }
  });
  if(changed)save();
}

  // Board click delegation
  document.getElementById('board').addEventListener('click',e=>{
    if(e.target.dataset.addStatus!==undefined){openAddTask(e.target.dataset.addStatus);return;}
    // Badge click → open game picker
    const badge=e.target.closest('.card-game-badge');
    if(badge){
      const card=badge.closest('.task-card');if(!card)return;
      showBadgePicker(card.dataset.id,badge);return;
    }
    const action=e.target.dataset.action||e.target.closest('[data-action]')?.dataset.action;
    const id=e.target.dataset.id||e.target.closest('[data-id]')?.dataset.id;
    if(!action||!id)return;
    if(action==='toggle') toggleDone(id);
    else if(action==='priority') togglePriority(id);
    else if(action==='to-ongoing') moveToOngoing(id);
    else if(action==='del') deleteTask(id);
    else if(action==='show-date'||action==='edit-date') showDateInput(e.target);
    else if(action==='open-link'){
      const link=e.target.dataset.link||e.target.closest('[data-link]')?.dataset.link;
      if(link) window.open(link,'_blank');
    }
    else if(action==='expand'){
      const card=document.querySelector(`.task-card[data-id="${id}"]`);if(!card)return;
      const opening=!card.classList.contains('expanded');
      card.classList.toggle('expanded',opening);
      if(opening){
        expandedCards.add(id);
        const note=card.querySelector('.card-note');
        if(note) requestAnimationFrame(()=>autoResize(note));
      }else{
        expandedCards.delete(id);
        const disp=card.querySelector('.title-display');
        if(disp){const ta=card.querySelector('.card-title');if(ta)disp.innerHTML=formatWithTimes(ta.value);}
      }
    }
    else if(action==='del-attach'){
      const attId=e.target.dataset.attId;
      const t=taskById(id);if(!t)return;
      t.attachments=(t.attachments||[]).filter(a=>a.id!==attId);
      save();expandedCards.add(id);renderApp();
    }
    else if(action==='view-attach'){
      const attId=e.target.dataset.attId;
      const t=taskById(id);if(!t)return;
      const att=(t.attachments||[]).find(a=>a.id===attId);
      if(att){const w=window.open();w.document.write(`<img src="${att.data}" style="max-width:100%">`);}
    }
    else if(action==='toggle-subtask'){
      const subId=e.target.dataset.subtaskId||e.target.closest('[data-subtask-id]')?.dataset.subtaskId;
      if(subId) toggleSubtask(id,subId);
    }
    else if(action==='del-subtask'){
      const subId=e.target.dataset.subtaskId||e.target.closest('[data-subtask-id]')?.dataset.subtaskId;
      if(subId) deleteSubtask(id,subId);

    const id=disp.dataset.id;if(!id)return;

  });

  document.getElementById('board').addEventListener('keydown',e=>{
    if(!e.target.classList.contains('subtask-inp'))return;
    if(e.key==='Enter'){e.preventDefault();addSubtask(e.target.dataset.id,e.target.value);e.target.value='';}
    if(e.key==='Escape'){e.target.value='';e.target.blur();}
  });

  // Context menu
  document.getElementById('board').addEventListener('contextmenu',e=>{
    const subtask=e.target.closest('.subtask');
    const card=e.target.closest('.task-card');
    if(!card)return;
    e.preventDefault();
    const subId=subtask?subtask.dataset.subtaskId:null;
    showCtxMenu(e.clientX,e.clientY,card.dataset.id,subId);
    // If right-click on subtask, do inline edit instead of showing ctx menu
    if(subtask){
      hideCtxMenu();
      const span=subtask.querySelector('.subtask-title');if(!span)return;
      const orig=span.textContent;
      const inp=document.createElement('input');
      inp.type='text';inp.value=orig;inp.className='form-control form-control-sm';
      inp.style.cssText='font-size:11px;height:22px;padding:1px 5px;';
      span.replaceWith(inp);inp.focus();inp.select();
      const save2=()=>{
        const val=inp.value.trim();
        if(val&&val!==orig){
          const t=taskById(card.dataset.id);if(t){
            const s=t.subtasks.find(x=>x.id===subId);
            if(s){s.title=val;patchTask(t.id,{subtasks:t.subtasks});renderApp();}
          }
        } else {renderApp();}
      };
      inp.addEventListener('blur',save2);
      inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();inp.blur();}if(ev.key==='Escape'){renderApp();}});
    }
  });
  document.getElementById('ctxEdit').addEventListener('click',()=>{if(ctxTaskId)openEditTask(ctxTaskId);hideCtxMenu();});
  document.getElementById('ctxMoveNext').addEventListener('click',()=>{if(ctxTaskId)moveTaskToNextWeek(ctxTaskId);hideCtxMenu();});

  document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCtxMenu();});

  // Board change
  document.getElementById('board').addEventListener('change',e=>{
    const{f,id}=e.target.dataset;if(!f||!id)return;
    if(f==='date'){
      const date=e.target.value||null;
      const updates={date};
      if(date) updates.weekKey=dateStrToWk(date);
      patchTask(id,updates);renderApp();
    } else if(f==='title'||f==='note'){
      patchTask(id,{[f]:e.target.value});

  // Board input
  document.getElementById('board').addEventListener('input',e=>{
    const{f,id}=e.target.dataset;

      autoResize(e.target);
      clearTimeout(e.target._t);
      e.target._t=setTimeout(()=>patchTask(id,{[f]:e.target.value}),350);

  // Board focusout
  document.getElementById('board').addEventListener('focusout',e=>{
    if(e.target.classList.contains('card-title')){
      const card=e.target.closest('.task-card');if(!card)return;
      const disp=card.querySelector('.title-display');
      if(disp) disp.innerHTML=formatWithTimes(e.target.value);
      return;
    }
    if(!e.target.classList.contains('date-input'))return;
    if(e.target.value)return;
    const card=e.target.closest('.task-card');if(!card)return;
    e.target.style.display='none';
    const chip=card.querySelector('.date-chip');
    const addBtn=card.querySelector('[data-action="show-date"]');
    if(chip) chip.style.display='';
    if(addBtn) addBtn.style.display='';

  // Calendar click → navigate + highlight
  document.getElementById('calView').addEventListener('click',e=>{

  // Notes
  document.getElementById('notesContainer').addEventListener('click',e=>{
    if(e.target.classList.contains('note-cdot')){setNoteColor(e.target.dataset.noteId,e.target.dataset.color);return;}
    if(e.target.dataset.delNote){deleteNote(e.target.dataset.delNote);return;}

  });
  document.getElementById('notesContainer').addEventListener('input',e=>{
    if(!e.target.classList.contains('note-ta'))return;
    autoResize(e.target);
    const noteId=e.target.dataset.noteId;
    clearTimeout(e.target._t);
    e.target._t=setTimeout(()=>saveNoteText(noteId,e.target.value),400);
  });

  // Attachment drag & drop
  const boardEl=document.getElementById('board');
  boardEl.addEventListener('dragover',e=>{
    const card=e.target.closest('.task-card');if(!card)return;
    e.preventDefault();card.classList.add('drag-over');
  });
  boardEl.addEventListener('dragleave',e=>{
    const card=e.target.closest('.task-card');if(!card)return;
    if(!card.contains(e.relatedTarget)) card.classList.remove('drag-over');
  });
  boardEl.addEventListener('drop',e=>{
    const card=e.target.closest('.task-card');if(!card)return;
    card.classList.remove('drag-over');
    const files=[...e.dataTransfer.files];if(!files.length)return;
    e.preventDefault();handleAttachUploadFiles(card.dataset.id,files);
  });

  // Attachment paste (Ctrl+V)
  document.addEventListener('paste',e=>{
    const items=[...(e.clipboardData?.items||[])];
    const files=items.filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);
    if(!files.length)return;
    const card=document.activeElement?.closest('.task-card')||document.querySelector('.task-card.expanded');
    if(!card)return;
    e.preventDefault();handleAttachUploadFiles(card.dataset.id,files);
  });

  // Vacation
  document.getElementById('btnVacation').addEventListener('click',openVacationModal);
  document.getElementById('vacAdd').addEventListener('click',addVacation);
  document.getElementById('vacationModal').addEventListener('click',e=>{
    if(e.target.dataset.delVac) deleteVacation(e.target.dataset.delVac);
  });

  // Recurring
  document.getElementById('btnRecurring').addEventListener('click',openRecurringModal);
  document.getElementById('rcAdd').addEventListener('click',addRecurring);
  document.getElementById('recurringModal').addEventListener('click',e=>{
    if(e.target.dataset.rcDel) deleteRecurring(e.target.dataset.rcDel);
    if(e.target.dataset.rcToggle) toggleRecurring(e.target.dataset.rcToggle);
  });

  // Edit task modal
  document.getElementById('etSave').addEventListener('click',saveEditTask);
  document.getElementById('etSubtaskInp').addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const val=e.target.value.trim();if(!val)return;
      editTaskSubtasks.push({id:uid(),title:val,done:false,link:null});
      e.target.value='';renderEtSubtasksList();
    }
  });
  document.getElementById('etSubtasksList').addEventListener('click',e=>{
    if(e.target.dataset.etSubDel!==undefined){
      editTaskSubtasks.splice(parseInt(e.target.dataset.etSubDel),1);
      renderEtSubtasksList();
    }
  });

  // At subtask input (add task modal)
  document.getElementById('atSubtaskInp').addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const val=e.target.value.trim();if(!val)return;
      newTaskSubtasks.push(val);
      e.target.value='';renderAtSubtasksList();
    }
  });
  document.getElementById('atSubtasksList').addEventListener('click',e=>{
    if(e.target.dataset.atSubDel!==undefined){
      newTaskSubtasks.splice(parseInt(e.target.dataset.atSubDel),1);
      renderAtSubtasksList();
    }
  });

  // Links modal
  document.getElementById('lmAdd').addEventListener('click',()=>{
    const label=document.getElementById('lmLabel').value.trim();
    const url=document.getElementById('lmUrl').value.trim();
    if(!label||!url){alert('Wpisz etykietę i URL.');return;}
    if(!state.links)state.links=[];
    state.links.push({id:uid(),label,url});
    save();renderLinksList();renderLinksBar();
    document.getElementById('lmLabel').value='';
    document.getElementById('lmUrl').value='';
  });
  document.getElementById('lmLabel').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lmAdd').click();});
  document.getElementById('lmUrl').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lmAdd').click();});
  document.getElementById('linksList').addEventListener('click',e=>{
    if(e.target.dataset.delLink){
      state.links=(state.links||[]).filter(l=>l.id!==e.target.dataset.delLink);
      save();renderLinksList();renderLinksBar();
    }
  });

  // Icon upload
  document.addEventListener('change',e=>{
    if(!e.target.classList.contains('icon-file-inp'))return;
    const gameName=e.target.dataset.game,file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=c.height=80;
        c.getContext('2d').drawImage(img,0,0,80,80);
        const g=state.games.find(x=>x.name===gameName);
        if(g){g.icon=c.toDataURL('image/jpeg',.9);save();renderApp();}
      };img.src=ev.target.result;
    };reader.readAsDataURL(file);
  });
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
async function init(){
  currentWeekKey=isoWeekKey(new Date());
  const savedHandle=await idbLoadHandle();
  if(savedHandle){
    const perm=await savedHandle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      try{state=await loadFromFile(savedHandle);fileHandle=savedHandle;}
      catch(err){console.warn('Could not load from file, falling back to localStorage',err);state=loadAndMigrate();}
    } else {
      fileHandle=savedHandle; // remember handle for later reconnect
      state=loadAndMigrate();
    }
  } else {
    state=loadAndMigrate();
  }
  if(!state.games.length){state.games=DEFAULT_GAMES.map(g=>({...g}));save();}
  // Ensure Daily Pipeline game exists in existing saves
  if(!state.games.find(g=>g.daily)) state.games.push({name:'Daily Pipeline',icon:'⚡',color:'#2ac3de',daily:true});
  seedDailyPipeline();
  seedRecurring();
  updateFileUI();
  initListeners();
  renderApp();
}
init();
</script>
